name: Build poster PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "poster/**"
      - ".github/workflows/build-poster.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: poster
          # shell-escape es necesario para que epstopdf convierta las imagenes .eps
          latexmk_shell_escape: true

      - name: Preparar artefacto de Pages
        run: |
          mkdir -p public
          cp poster/main.pdf public/poster.pdf
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Selección de técnicas de vectorización de discursos políticos</title>
            <style>
              html, body { margin: 0; height: 100%; background: #1b1b1b; }
              embed { width: 100%; height: 100%; border: 0; }
            </style>
          </head>
          <body>
            <embed src="./poster.pdf" type="application/pdf">
          </body>
          </html>
          HTML

      - name: Subir PDF como artefacto de la corrida
        uses: actions/upload-artifact@v7
        with:
          name: poster
          path: poster/main.pdf

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
